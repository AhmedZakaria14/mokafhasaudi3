<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Shield -->
  <path d="M256 32 L448 96 V256 C448 376 256 480 256 480 C256 480 64 376 64 256 V96 L256 32 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#glow)" />

  <!-- Inner Golden Border -->
  <path d="M256 68 L412 120 V248 C412 346 256 432 256 432 C256 432 100 346 100 248 V120 L256 68 Z" 
        fill="none" stroke="#fbbf24" stroke-width="4" stroke-dasharray="12 6" opacity="0.85" />

  <!-- Central Palm & Emblems -->
  <g transform="translate(256, 210)" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="0" y1="-60" x2="0" y2="60" />
    <!-- Palm fronds -->
    <path d="M0 -40 C-30 -60 -50 -40 -60 -10" />
    <path d="M0 -40 C30 -60 50 -40 60 -10" />
    <path d="M0 -10 C-35 -20 -60 0 -70 30" />
    <path d="M0 -10 C35 -20 60 0 70 30" />
    <path d="M0 20 C-40 20 -60 40 -65 70" />
    <path d="M0 20 C40 20 60 40 65 70" />
  </g>

  <!-- Certified Badge -->
  <circle cx="256" cy="360" r="42" fill="#047857" stroke="#fbbf24" stroke-width="6" filter="url(#glow)" />
  <path d="M240 360 L252 372 L274 346" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>